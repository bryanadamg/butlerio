# 1883: plaintext, only reachable inside the compose network (HA -> mosquitto).
listener 1883

# 8883: TLS, published to the internet for the ESP32. Certs copied in by
# ../../mosquitto-cert-hook.sh on each Let's Encrypt renewal.
listener 8883
certfile /mosquitto/config/certs/fullchain.pem
keyfile /mosquitto/config/certs/privkey.pem

allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
